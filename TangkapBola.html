<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tangkap Bola - Grafik Komputer</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#12162b;color:#fff;font-family:"Segoe UI",system-ui,sans-serif}
.app{display:flex;gap:16px;padding:16px;height:100%;max-width:1500px;margin:auto}
.stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
canvas{width:100%;max-height:100%;aspect-ratio:3/2;border-radius:16px;background:#191e3a;box-shadow:0 10px 40px #0008;touch-action:none;display:block}
aside{width:300px;background:#1c2142;border-radius:16px;padding:16px;overflow:auto}
h2{margin:0 0 10px;font-size:16px;color:#ffd250}
.hs{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;background:#262c55;margin-bottom:6px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:5px 3px;text-align:left;border-bottom:1px solid #ffffff18}
th{color:#97a0cc;font-weight:600}
button{background:#3a4280;color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;margin-top:10px}
button:hover{background:#4b55a8}
.k{font-size:12px;color:#97a0cc;margin-top:12px;line-height:1.5}
#st{font-size:12px;margin-top:12px}
@media(max-width:820px){.app{flex-direction:column;height:auto}aside{width:100%}}
</style></head><body>
<div class="app">
<div class="stage"><canvas id="c" width="900" height="600"></canvas></div>
<aside>
<h2>🏆 High Score</h2><div id="hs"></div>
<h2 style="margin-top:16px">📜 Riwayat Permainan</h2><div id="hist"></div>
<button id="clr">Hapus riwayat</button>
<div class="k">Kontrol: ← → / A D atau gerakkan mouse/jari<br>H debug · R ulang · M menu · 1/2/3 pilih level<br>Logika game dijalankan oleh <b>Python</b>; halaman ini hanya tampilan.</div>
<div id="st" style="color:#ff6e78">● Menghubungkan ke Python...</div>
</aside></div>
<script>
// HTML = INPUT (kirim ke Python) + OUTPUT (gambar state dari Python). Tidak ada logika game di sini.
const cv=document.getElementById("c"),g=cv.getContext("2d"),st=document.getElementById("st");
let S=null,panelKey="";

// ---------- kirim input ke Python ----------
function send(o){fetch("/input",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o),keepalive:true}).catch(()=>{})}
addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
  if(e.repeat)return;
  send({t:"key",key:e.key,down:true});
});
addEventListener("keyup",e=>send({t:"key",key:e.key,down:false}));
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*900/r.width,(e.clientY-r.top)*600/r.height]}
let lastMove=0;
cv.addEventListener("pointermove",e=>{const n=performance.now();if(n-lastMove<16)return;lastMove=n;send({t:"move",x:pos(e)[0]})});
cv.addEventListener("pointerdown",e=>{const[x,y]=pos(e);send({t:"click",x,y})});
document.getElementById("clr").onclick=()=>send({t:"clear"});

// ---------- terima state dari Python ----------
const es=new EventSource("/stream");
es.onmessage=e=>{S=JSON.parse(e.data);st.textContent="● Terhubung ke Python";st.style.color="#78ffa0";panel()};
es.onerror=()=>{st.textContent="● Terputus — jalankan GK_MiniGame.py";st.style.color="#ff6e78"};

function panel(){
  const k=JSON.stringify([S.high,S.hist]);if(k===panelKey)return;panelKey=k;
  document.getElementById("hs").innerHTML=Object.entries(S.high).map(([n,b])=>`<div class="hs"><span style="color:${S.warna[n]}">${n}</span><b>${b}</b></div>`).join("");
  const rows=S.hist.map(h=>`<tr><td>${h.t}</td><td>${h.l}</td><td><b>${h.s}</b></td><td>${h.d}s</td></tr>`).join("");
  document.getElementById("hist").innerHTML=rows?`<table><tr><th>Waktu</th><th>Level</th><th>Skor</th><th>Durasi</th></tr>${rows}</table>`:'<div class="k">Belum ada permainan.</div>';
}

// ---------- gambar ----------
function draw(){
  requestAnimationFrame(draw);
  const W=900,H=600;
  g.clearRect(0,0,W,H);
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,"#1d2350");gr.addColorStop(1,"#12162b");
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.textAlign="center";
  if(!S){g.fillStyle="#97a0cc";g.font="20px Segoe UI,sans-serif";g.fillText("Menunggu Python...",W/2,H/2);return}
  if(!S.level){
    g.fillStyle="#fff";g.font="bold 54px Segoe UI,sans-serif";g.fillText("TANGKAP BOLA",W/2,130);
    g.font="18px Segoe UI,sans-serif";g.fillStyle="#97a0cc";g.fillText("Mini Game Grafik Komputer — Collision Detection Lingkaran vs AABB",W/2,170);
    S.menu.forEach((L,i)=>{
      const t=230+i*95;
      g.fillStyle="#262c55";g.beginPath();g.roundRect(250,t,400,80,14);g.fill();
      g.strokeStyle=L.warna;g.lineWidth=2;g.stroke();
      g.fillStyle=L.warna;g.font="bold 24px Segoe UI,sans-serif";g.fillText(`[${L.key}] ${L.nama}`,W/2,t+34);
      g.fillStyle="#97a0cc";g.font="16px Segoe UI,sans-serif";g.fillText(`${L.ket}  •  best ${L.best}`,W/2,t+58);
    });
    g.fillStyle="#fff";g.font="16px Segoe UI,sans-serif";g.fillText("Klik level atau tekan 1 / 2 / 3",W/2,555);
    return;
  }
  const kr=S.kr;
  g.fillStyle="#5ac8ff";g.beginPath();g.roundRect(kr[0],kr[1],kr[2],kr[3],6);g.fill();
  for(const b of S.bola){
    g.fillStyle="#ffd250";g.beginPath();g.arc(b[0],b[1],S.r,0,7);g.fill();
    if(S.debug){g.strokeStyle="#50ff78";g.lineWidth=1;g.stroke()}
  }
  if(S.debug){
    g.strokeStyle="#ff5050";g.lineWidth=1;g.strokeRect(kr[0],kr[1],kr[2],kr[3]);
    g.textAlign="left";g.fillStyle="#78ffa0";g.font="14px Consolas,monospace";
    S.debug_lines.forEach((t,i)=>g.fillText(t,16,64+i*20));
  }
  g.textAlign="left";g.fillStyle="#fff";g.font="bold 18px Segoe UI,sans-serif";
  g.fillText(`${S.level.nama}   Skor: ${S.skor}   Nyawa: ${"❤".repeat(Math.max(S.nyawa,0))}   Best: ${Math.max(S.best,S.skor)}`,16,30);
  g.textAlign="right";g.fillStyle="#97a0cc";g.font="14px Segoe UI,sans-serif";g.fillText("[H] debug  [M] menu  [R] ulang",W-16,30);
  if(S.over){
    g.fillStyle="#000a";g.fillRect(0,0,W,H);g.textAlign="center";
    g.fillStyle="#ff6e78";g.font="bold 48px Segoe UI,sans-serif";g.fillText("GAME OVER",W/2,H/2-30);
    g.fillStyle="#fff";g.font="26px Segoe UI,sans-serif";g.fillText(`Skor ${S.skor}`,W/2,H/2+14);
    if(S.new_best){g.fillStyle="#ffd250";g.fillText("🏆 HIGH SCORE BARU!",W/2,H/2+52)}
    g.fillStyle="#97a0cc";g.font="16px Segoe UI,sans-serif";g.fillText("R / klik = ulang   M = menu",W/2,H/2+88);
  }
}
requestAnimationFrame(draw);
</script></body></html>
